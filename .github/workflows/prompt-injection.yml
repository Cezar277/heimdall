name: Prompt injection corpus

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    # Runner hébergé par GitHub : VM jetable, aucune machine du projet exposée.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python 3.12, pas 3.10 : requirements.lock épingle filelock 4.1.0 (CVE,
      # correctifs >= 4.2.1 réservés à Python >= 3.11) sous 3.10 et 4.2.4 au-delà ;
      # pip-audit échouerait en 3.10. La compatibilité 3.10 du code reste
      # vérifiée statiquement (mypy python_version / ruff target-version).
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python3 -m venv --clear .venv-injection
          .venv-injection/bin/python -m pip install --require-hashes -r requirements.lock
          .venv-injection/bin/python -m pip install -e . --no-deps --no-build-isolation
      - name: Corpus déterministe (aucun Ollama)
        run: .venv-injection/bin/python -m pytest tests/test_prompt_injection_corpus.py -m 'not llm'
