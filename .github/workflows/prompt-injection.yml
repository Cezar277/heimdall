name: Prompt injection corpus

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    # Runner GitHub éphémère, aucun secret, aucun accès au runner self-hosted.
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e . --no-deps --no-build-isolation
      - name: Corpus déterministe (aucun Ollama)
        run: python -m pytest tests/test_prompt_injection_corpus.py -m 'not llm'
