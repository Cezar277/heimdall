name: Prompt injection corpus

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    # Runner hébergé par GitHub : VM jetable, aucune machine du projet exposée.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.10 (version de génération de requirements.lock)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - name: Install locked dependencies
        run: |
          python3 -m venv --clear .venv-injection
          .venv-injection/bin/python -m pip install --require-hashes -r requirements.lock
          .venv-injection/bin/python -m pip install -e . --no-deps --no-build-isolation
      - name: Corpus déterministe (aucun Ollama)
        run: .venv-injection/bin/python -m pytest tests/test_prompt_injection_corpus.py -m 'not llm'
