name: CI Security & Quality

# Ce workflow ne tourne volontairement PAS à chaque push de branche (#20) :
# quota GitHub contenu et bruit évité. Trois déclencheurs seulement :
#   1. pull_request_review : la CI démarre quand un relecteur approuve la PR
#      (`review.state == 'approved'`) et qu'il est collaborateur de confiance
#      (garde author_association plus bas, même liste qu'opencode-review).
#      GitHub exécute alors le workflow sur la ref de merge
#      `refs/pull/<n>/merge` : le statut s'attache à la PR et la protection
#      de `main` peut l'exiger.
#   2. push sur `main` : preuve « pipeline vert sur main » (le merge est déjà
#      conditionné à une approbation).
#   3. workflow_dispatch : commande spéciale (Actions > Run workflow ; le
#      bouton n'apparaît qu'une fois le workflow présent sur `main`).
# Un nouveau commit poussé après approbation (y compris « Update branch »)
# exige une nouvelle approbation : comportement voulu (le dispatch manuel
# relance la CI à la demande, par exemple pour déboguer).
on:
  pull_request_review:
    types: [submitted]
  push:
    branches: [main]
  workflow_dispatch:

# Moindre privilège (#20) ; jamais de pull_request_target.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-security:
    name: Lint, Typecheck, Audit & Test
    # Runner self-hosted, comme les autres workflows : 0 minute GitHub.
    runs-on: self-hosted
    timeout-minutes: 20
    # Seules les approbations d'un collaborateur de confiance déclenchent la
    # CI (garde author_association, même liste que le workflow opencode-review) :
    # un compte externe ne peut pas faire tourner du code sur le runner.
    if: >-
      github.event_name != 'pull_request_review' ||
      (github.event.review.state == 'approved' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install (requirements.lock, hashes SHA-256)
        run: |
          rm -rf .venv-ci
          python3 -m venv .venv-ci
          .venv-ci/bin/pip install --upgrade pip
          .venv-ci/bin/pip install --require-hashes -r requirements.lock
          .venv-ci/bin/pip install -e . --no-deps

      - name: Lint (ruff)
        run: .venv-ci/bin/ruff check heimdall tests

      - name: Types (mypy strict)
        run: .venv-ci/bin/mypy heimdall tests/contracts/fastapi_contract_fixture.py

      - name: SAST (bandit)
        run: .venv-ci/bin/bandit -r heimdall -q

      - name: Tests + couverture >= 85 %
        run: >-
          .venv-ci/bin/python -m pytest
          --cov=heimdall --cov-branch --cov-report=term-missing --cov-fail-under=85

      - name: Audit dépendances (pip-audit, exception réseau documentée README)
        run: .venv-ci/bin/pip-audit --skip-editable
