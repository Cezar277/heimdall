name: Security model

# No path filter: this check can be required without leaving unrelated PRs pending.
on:
  pull_request:
  push:
    branches: [main, 18-t18-modele-de-menaces-stride-et-dfd]

permissions:
  contents: read

jobs:
  security-model:
    name: Security model
    # Do not execute contributor-controlled document tests on the shared runner.
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install isolated checker test dependencies
        run: |
          python3 -m venv .venv-security
          .venv-security/bin/python -m pip install --require-hashes -r tests/security/requirements.txt
      - name: Check documents and regression coverage
        run: |
          .venv-security/bin/python docs/security/check_model.py
          .venv-security/bin/python -m pytest tests/test_check_model.py tests/security --cov=docs/security --cov-branch --cov-report=term-missing --cov-fail-under=95
      - name: Check PR whitespace and identify reviewed artifacts
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "bad BASE_SHA"; exit 1; }
              git cat-file -e "$BASE_SHA^{commit}"
              git diff --check "$BASE_SHA"...HEAD
              ;;
            push)
              [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "bad BEFORE_SHA"; exit 1; }
              if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
                # New branch: compare the full tree against the empty Git tree.
                EMPTY_TREE=$(git hash-object -t tree --stdin < /dev/null)
                git diff --check "$EMPTY_TREE" HEAD
              else
                # Two endpoints also cover force-pushes without assuming ancestry.
                git cat-file -e "$BEFORE_SHA^{commit}"
                git diff --check "$BEFORE_SHA" HEAD
              fi
              ;;
            *) echo "unsupported event"; exit 1 ;;
          esac
          git rev-parse HEAD
          sha256sum docs/security/dfd.drawio docs/security/dfd.png
