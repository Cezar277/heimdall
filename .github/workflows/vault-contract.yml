name: Vault contract

on:
  pull_request:
    paths:
      - openapi.yaml
      - .spectral.yaml
      - schemas/**
      - tests/contracts/**
      - docs/contracts/vault-api.md
      - .github/workflows/vault-contract.yml
  push:
    branches: [main, 15-t15-specification-openapi-du-vault-v1]
    paths:
      - openapi.yaml
      - .spectral.yaml
      - schemas/**
      - tests/contracts/**
      - docs/contracts/vault-api.md
      - .github/workflows/vault-contract.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install test dependencies
        run: python -m pip install -r tests/contracts/requirements.txt
      - name: Validate schemas and FastAPI contract
        run: python -m unittest discover -s tests/contracts -v
      - name: Lint OpenAPI
        run: npx --yes @stoplight/spectral-cli@6.15.0 lint openapi.yaml --fail-severity warn
