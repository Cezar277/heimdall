name: Vault contract

on:
  pull_request:
    paths:
      - openapi.yaml
      - .spectral.yaml
      - package.json
      - package-lock.json
      - .npmrc
      - schemas/**
      - tests/contracts/**
      - tests/js/**
      - vendor/**
      - docs/contracts/vault-api.md
      - .github/workflows/vault-contract.yml
  push:
    branches: [main, 15-t15-specification-openapi-du-vault-v1]
    paths:
      - openapi.yaml
      - .spectral.yaml
      - package.json
      - package-lock.json
      - .npmrc
      - schemas/**
      - tests/contracts/**
      - tests/js/**
      - vendor/**
      - docs/contracts/vault-api.md
      - .github/workflows/vault-contract.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # tests/contracts/requirements.txt est compilé pour Python >= 3.11 (pip-compile 3.12 :
      # pas d'exceptiongroup, coverage 7.17 exige >= 3.11) ; requirements.lock
      # (CLI, ci.yml) reste en 3.10.
      - name: Python 3.12 (version de génération de tests/contracts/requirements.txt)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup Python venv and install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          # LOW-4 : hashes SHA-256 vérifiés à l'installation.
          .venv/bin/pip install --require-hashes -r tests/contracts/requirements.txt

      - name: Validate schemas and FastAPI contract
        run: |
          .venv/bin/python -m unittest discover -s tests/contracts -v

      - name: SAST contract fixture
        # LOW review : la fixture qui prouve le 404/405 est aussi passée au
        # SAST (bandit + ruff S). Le gel de format ruff reste exclu via
        # pyproject, mais un fichier passé explicitement est toujours vérifié.
        run: |
          .venv/bin/bandit tests/contracts/fastapi_contract_fixture.py
          .venv/bin/ruff check --select S tests/contracts/fastapi_contract_fixture.py

      - name: Node 24 (spectral-cli exige Node 22 ou >=24)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install npm dependencies
        # LOW-4 : Spectral figé par package-lock.json, installé via `npm ci`
        # (intégrité vérifiée) au lieu d'un `npx` sans vérification.
        # Node 22 ou >=24 requis par spectral-cli 6.17.0 ; .npmrc active
        # engine-strict pour échouer tôt sur une version incompatible.
        # Garde-temps : un registre npm accroché ne doit pas immobiliser le
        # runner (défaut 360 min).
        timeout-minutes: 5
        run: |
          node --version
          npm --version
          npm ci --no-audit --no-fund

      - name: Test shim minimatch et bundler Spectral
        timeout-minutes: 5
        run: npm run test:js

      - name: Audit npm (dev)
        timeout-minutes: 2
        run: npm audit --audit-level=moderate

      - name: Lint OpenAPI
        timeout-minutes: 2
        run: ./node_modules/.bin/spectral lint openapi.yaml --fail-severity warn
